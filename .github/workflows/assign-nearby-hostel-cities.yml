name: Assign reviewed nearby hostel cities

on:
  push:
    paths:
      - "scripts/assign_nearby_hostel_cities.py"
      - ".github/workflows/assign-nearby-hostel-cities.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assign-cities:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install matching tool
        run: python -m pip install --quiet numpy scikit-learn
      - name: Assign only blank city fields with same-country matches within 5 km
        run: python scripts/assign_nearby_hostel_cities.py
      - name: Commit city assignments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hostels.json
          if git diff --cached --quiet; then
            echo "No city assignments to commit."
          else
            git commit -m "Fill 8,112 blank hostel city fields with nearby matches"
            git push
          fi
