name: Create persistent city index

on:
  push:
    paths:
      - "scripts/migrate_city_index.py"
      - ".github/workflows/migrate-city-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create city index from existing database
        run: python scripts/migrate_city_index.py
      - name: Commit persistent city index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cities.json
          if git diff --cached --quiet; then
            echo "City index unchanged."
          else
            git commit -m "Create persistent canonical city index"
            git push
          fi
