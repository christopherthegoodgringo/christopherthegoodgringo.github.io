name: Read-only hostel database audit

on:
  push:
    paths:
      - "scripts/audit_hostels.py"
      - "scripts/check_city_search.py"
      - "scripts/enrich_duplicate_review.py"
      - ".github/workflows/audit-hostels.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Audit current data without changing hostel records
        run: python scripts/audit_hostels.py
      - name: Check city search and duplicate safeguards
        run: python scripts/check_city_search.py
      - name: Enrich duplicate candidates from source records (read-only)
        run: python scripts/enrich_duplicate_review.py
      - name: Save audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/hostel-database-audit.md reports/hostel-city-suggestions.csv reports/hostel-city-proposals-high-confidence.csv reports/hostel-duplicate-review.csv reports/hostel-duplicate-source-details.csv
          if git diff --cached --quiet; then
            echo "Audit reports unchanged."
          else
            git commit -m "Add read-only hostel database audit report"
            git push
          fi
