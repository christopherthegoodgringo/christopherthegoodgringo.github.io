name: Read-only hostel database audit

on:
  push:
    paths:
      - "scripts/audit_hostels.py"
      - ".github/workflows/audit-hostels.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Audit current data without changing hostel records
        run: python scripts/audit_hostels.py
      - name: Save audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/hostel-database-audit.md
          if git diff --cached --quiet; then
            echo "Audit report unchanged."
          else
            git commit -m "Add read-only hostel database audit report"
            git push
          fi
