name: Weekly hostel database audit

on:
  schedule:
    - cron: "23 7 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-hostels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh Latin America hostel data
        run: python scripts/update_hostels.py
      - name: Commit refreshed data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hostels.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh weekly Latin America hostel database"
            git push
          else
            echo "Hostel database unchanged."
          fi
