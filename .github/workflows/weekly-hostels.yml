name: Hostel database refresh (paused)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Explain pause
        run: |
          echo "Automatic refresh is paused while the hostel directory is redesigned around a persistent master list."
          echo "Do not run the old full-rebuild script until merge-safe import and review workflows are in place."
