<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Business Information | Christopher the Good Gringo</title><style>:root{--green:#103e2f;--deep:#09291e;--gold:#f5bd3e;--cream:#fffdf8;--ink:#203027;--muted:#66736a}*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.55}.cgg-global-header{background:var(--green);border-bottom:3px solid var(--gold);padding:15px clamp(16px,4vw,44px);display:flex;align-items:center;gap:24px;flex-wrap:wrap}.cgg-global-brand{display:flex;align-items:center;gap:10px;color:var(--cream);font-weight:900;text-decoration:none;white-space:nowrap}.cgg-global-brand img{width:48px;height:48px;object-fit:contain}.cgg-global-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cgg-global-nav a{color:var(--cream);text-decoration:none;font-weight:800;font-size:.9rem;padding:8px 11px;border-radius:999px;white-space:nowrap}.cgg-global-nav a:hover,.cgg-global-nav a:focus-visible{background:var(--gold);color:var(--deep)}main{max-width:1180px;margin:0 auto;padding:36px 20px 56px}h1{font-size:clamp(2rem,4vw,3.1rem);line-height:1.1;margin:0 0 12px;color:var(--green)}.intro{color:var(--muted);max-width:800px;margin:0 0 28px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 24px}.filters input,.filters select{padding:12px 14px;border:1px solid #cbd3cc;border-radius:9px;font:inherit;background:white;min-width:190px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.listing-card{background:white;border:1px solid #e0e5df;border-radius:15px;overflow:hidden;box-shadow:0 5px 18px #09291e0c;position:relative;display:flex;flex-direction:column}.listing-card img{width:100%;height:190px;object-fit:cover;background:#e8ece8}.listing-card .body{padding:17px;display:flex;flex-direction:column;flex:1}.listing-card h2{font-size:1.2rem;line-height:1.25;margin:0 0 7px;color:var(--green)}.listing-card p{margin:4px 0;color:#4d5b51}.tier{position:absolute;top:12px;right:12px;padding:6px 10px;border-radius:5px;font-size:.72rem;font-weight:900;letter-spacing:.04em}.platinum{background:#e4e8ed;border:1px solid #9ca8b6;color:#374151}.gold{background:#f7e8bd;border:1px solid #d6a84f;color:#654810}.silver{background:#e7eaee;border:1px solid #b8c0c9;color:#4b5563}.more,.action{display:flex;align-items:center;justify-content:center;margin-top:auto;padding:12px 15px;border-radius:9px;background:var(--green);border:1px solid var(--gold);color:var(--cream);text-decoration:none;font-weight:800;text-align:center}.more{margin-top:15px}.more:hover,.action:hover{background:var(--deep)}.empty{padding:25px;border:1px dashed #b8c6bb;border-radius:12px;color:var(--muted);background:white}footer{background:var(--green);border-top:3px solid var(--gold);padding:22px 18px;color:var(--cream);text-align:center}footer nav{display:flex;justify-content:center;gap:8px 16px;flex-wrap:wrap}footer a{color:var(--cream);font-weight:700;text-decoration:none}footer a:hover{color:var(--gold)}@media(max-width:650px){.cgg-global-header{gap:10px}.cgg-global-brand{white-space:normal}.cgg-global-nav{gap:4px}.cgg-global-nav a{font-size:.82rem;padding:7px 9px}main{padding:26px 14px 42px}}.detail{max-width:860px;margin:auto;background:white;border:1px solid #e0e5df;border-radius:16px;overflow:hidden;box-shadow:0 8px 26px #09291e12}.detail img{display:block;width:100%;max-height:420px;object-fit:cover;background:#e8ece8}.detail-content{padding:clamp(20px,4vw,38px)}.detail-content h1{font-size:clamp(1.8rem,4vw,2.6rem)}.detail-content p{margin:9px 0}.detail-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.action.secondary{background:#fff;color:var(--green);border:1px solid #b8c6bb}.kicker{font-weight:900;color:#7a5a12;letter-spacing:.09em;text-transform:uppercase;font-size:.78rem}.error{padding:25px;background:white;border-radius:12px}</style></head><body><main><div id="content"><p>Loading listing information…</p></div></main><script>
const params=new URLSearchParams(location.search),type=params.get('type')||'',id=params.get('id')||'';
const sources={hotels:[['/data/hotels.json','hotels']],hostels:[['/data/hostels-clean.json','hostels'],['/data/paid-listings.json','hostels']],restaurants:[['/data/restaurants.json','restaurants']],bars:[['/data/bars.json','bars']], 'street-food':[['/data/street-food.json','streetFood']]};
function text(v){return typeof v==='string'?v:''}
function tierOf(h){let t=text(h.membershipTier).toLowerCase();if(!t)t=({premium:'platinum',featured:'gold',silver:'silver'}[text(h.listingPlan).toLowerCase()]||'bronze');return t}
function officialSite(h){const urls=[h.officialWebsite,h.website,h.bookingUrl].filter(u=>typeof u==='string'&&/^https?:\/\//i.test(u));return urls.find(u=>type==='hostels'&&/hostelworld\.com/i.test(u))||urls.find(u=>!/(expedia\.|booking\.com|hotels\.com|agoda\.|trip\.com|tripadvisor\.|opentable\.|google\.[^/]+\/maps\/search|maps\.google\.|openstreetmap\.org|waze\.com)/i.test(u))||''}
function addLine(root,label,value){if(!value)return;const p=document.createElement('p');const b=document.createElement('strong');b.textContent=label+': ';p.append(b,document.createTextNode(Array.isArray(value)?value.join(' · '):String(value)));root.appendChild(p)}
async function load(){const content=document.getElementById('content');if(!sources[type]||!id){content.innerHTML='<div class="error"><h1>Listing not found</h1><p>Please return to a finder and choose More Information on a listing.</p><a class="action" href="/">Return home</a></div>';return}try{let all=[];for(const [url,key] of sources[type]){try{const response=await fetch(url,{cache:'no-store'});if(response.ok){const data=await response.json();if(Array.isArray(data[key]))all=all.concat(data[key])}}catch(e){}}const item=all.find(h=>String(h.id||'')===id)||all.find(h=>String(h.name||'')===id);if(!item)throw new Error('Listing unavailable');const tier=tierOf(item);const wrap=document.createElement('article');wrap.className='detail';const photo=item.photo||(Array.isArray(item.photoUrls)?item.photoUrls[0]:'')||(Array.isArray(item.images)?item.images[0]:'');if(photo){const img=document.createElement('img');img.src=photo;img.alt=item.name||'Business photo';img.loading='eager';wrap.appendChild(img)}const body=document.createElement('div');body.className='detail-content';const kicker=document.createElement('div');kicker.className='kicker';kicker.textContent=tier+' listing · '+type.replace('-',' ');body.appendChild(kicker);const h1=document.createElement('h1');h1.textContent=item.name||'Business listing';body.appendChild(h1);addLine(body,'Location',[item.city,item.countryName||item.country].filter(Boolean).join(', '));addLine(body,'Address',item.address);addLine(body,'Price range',item.priceRange);addLine(body,type==='bars'?'Drinks':type==='restaurants'||type==='street-food'?'Cuisine':'Description',item.cuisine||item.drinks||item.description);addLine(body,'About',item.description);addLine(body,'Amenities',item.amenities||item.features);const actions=document.createElement('div');actions.className='detail-actions';const site=officialSite(item);if(site){const a=document.createElement('a');a.className='action';a.href=site;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Official Website';actions.appendChild(a)}const back=document.createElement('a');back.className='action secondary';back.href=({hotels:'/hotels.html',hostels:'/hostels.html',restaurants:'/restaurants.html',bars:'/bars.html','street-food':'/street-food-finder.html'})[type];back.textContent='Back to Finder';actions.appendChild(back);body.appendChild(actions);wrap.appendChild(body);content.replaceChildren(wrap)}catch(e){content.innerHTML='<div class="error"><h1>Listing information unavailable</h1><p>This listing could not be loaded. Please return to the finder and try again.</p><a class="action" href="/">Return home</a></div>'}}
load();
</script></body></html>
